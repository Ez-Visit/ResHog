name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ResHog.slnx

      - name: Build
        run: dotnet build ResHog.slnx -c Release -warnaserror

      - name: Run tests
        run: dotnet test ResHog.slnx -c Release --verbosity normal --collect:"XPlat Code Coverage"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: '**/TestResults/**/coverage.cobertura.xml'
          if-no-files-found: ignore

  code-style:
    name: Code Format Check
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Check formatting
        run: dotnet format ResHog.slnx --verify-no-changes --severity warn

  eol-check:
    name: Line Ending Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify line endings against .gitattributes
        run: |
          git ls-files --eol | awk -F'\t' '
          {
            split($1, a, /[ \t]+/)
            idx = a[1]; wt = a[2]
            if (idx == "i/crlf") { printf "VIOLATION (index not normalized): %s\n", $2; bad = 1 }
            if ($1 ~ /eol=crlf/ && wt == "w/lf") { printf "VIOLATION (expects CRLF, worktree is LF): %s\n", $2; bad = 1 }
            if ($1 ~ /eol=lf/ && wt == "w/crlf") { printf "VIOLATION (expects LF, worktree is CRLF): %s\n", $2; bad = 1 }
          }
          END { exit (bad ? 1 : 0) }'

  analyze:
    name: Code Analysis
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ResHog.slnx

      - name: Run analyzers
        run: dotnet build ResHog.slnx -c Release /p:TreatWarningsAsErrors=true /p:EnforceCodeStyleInBuild=true
